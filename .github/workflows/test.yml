name: Spring PetClinic CI

on:
  push:
    branches:
      - main

  pull_request:
    branches:
      - main

  workflow_dispatch:

jobs:
  build:
    name: Build, Test and Code Quality
    runs-on: ubuntu-latest

    steps:
      # 1. Checkout source code
      - name: Checkout Repository
        uses: actions/checkout@v4

      # 2. Setup Java
      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: maven

      # 3. Verify Java and Maven
      - name: Verify Java and Maven
        run: |
          java -version
          ./mvnw -version

      # 4. Maven build, tests and Checkstyle
      - name: Maven Build and Code Quality Check
        run: ./mvnw clean verify

      # 5. Verify generated artifacts
      - name: Verify JAR
        run: ls -lh target/*.jar
